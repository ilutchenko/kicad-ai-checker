[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kischk"
version = "0.1.0"
description = "KiCad schematic checker"
requires-python = ">=3.11"

[project.scripts]
kischk-main-cycle = "kischk.cli.check_schematic:main"
kischk-evaluation = "kischk.cli.evaluation:main"
kischk-results-check = "kischk.cli.results_check:main"
kischk-detector-prompt-editor = "kischk.cli.detector_prompt_editor:main"
kischk-preprocessing-editor = "kischk.cli.preprocessing_editor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
